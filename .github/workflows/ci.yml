name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true

      - name: Format check
        if: runner.os == 'Linux'
        run: |
          $files = gofmt -l .
          if ($files) { Write-Error "Not gofmt'd: $files"; exit 1 }
        shell: pwsh

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Vulnerability check (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Self-test
        run: go run crawler.go --selftest
