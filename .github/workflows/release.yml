name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  binaries:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" -o gocrawler-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} crawler.go
      - name: Package
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q gocrawler-${{ matrix.goos }}-${{ matrix.goarch }}.zip gocrawler-${{ matrix.goos }}-${{ matrix.goarch }}.exe
          else
            tar czf gocrawler-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz gocrawler-${{ matrix.goos }}-${{ matrix.goarch }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gocrawler-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            gocrawler-*.zip
            gocrawler-*.tar.gz

  debian:
    name: build .deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - name: Build and package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p stage/DEBIAN stage/usr/bin stage/usr/share/doc/gocrawler
          CGO_ENABLED=0 go build -trimpath -o stage/usr/bin/gocrawler crawler.go
          cp README.md stage/usr/share/doc/gocrawler/README.md
          cp LICENSE stage/usr/share/doc/gocrawler/copyright
          cat > stage/DEBIAN/control <<EOF
          Package: gocrawler
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Juan Ignacio Perez Sacristan <computerphysicslab@gmail.com>
          Description: topic-restricted crawler that builds curated text corpora
          Homepage: https://github.com/computerphysicslab/goCrawler
          EOF
          dpkg-deb --build stage gocrawler_${VERSION}_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: gocrawler-deb
          path: gocrawler_*.deb

  release:
    name: publish release
    needs: [binaries, debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
